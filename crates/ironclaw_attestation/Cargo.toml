[package]
name = "ironclaw_attestation"
version = "0.1.0"
publish = false  # internal substrate crate; not yet released to crates.io
edition = "2024"
rust-version = "1.92"
description = "Canonical signing-bytes + ApprovedTxHash core for the IronClaw attested-signing substrate (chain-SDK-free, no secrets/webauthn)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"

[package.metadata.dist]
dist = false

[features]
default = []
# Expose the `*_contract_cases!` suites publicly (instead of only to this
# crate's own `#[cfg(test)]` tree) so the durable-backend crate
# (`ironclaw_attested_store`) can drive its PG / libSQL stores through the SAME
# behavioural contract. Pulls in tokio because the concurrent-claim case spawns
# tasks. No chain/secret deps — the architecture purity test still holds.
contract-suite = ["dep:tokio"]

[dependencies]
async-trait = "0.1"
ironclaw_signing_provider = { path = "../ironclaw_signing_provider" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"], optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

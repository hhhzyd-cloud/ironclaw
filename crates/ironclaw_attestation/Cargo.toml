[package]
name = "ironclaw_attestation"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Canonical signing-bytes + ApprovedTxHash core for the IronClaw attested-signing substrate (chain-SDK-free, no secrets/webauthn)"
authors = ["NEAR AI <support@near.ai>"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nearai/ironclaw"
repository = "https://github.com/nearai/ironclaw"

[package.metadata.dist]
dist = false

[dependencies]
async-trait = "0.1"
ironclaw_signing_provider = { path = "../ironclaw_signing_provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
# WebAuthn assertion crypto (COSE key handling + ECDSA/EdDSA verification). We
# use the lower-level *-core crate for `COSEKey::verify_signature` and the COSE
# key model, and drive the Relying-Party policy checks (UV, type, challenge
# echo, rpIdHash, origin, signCount regression, BE/BS) ourselves in verify.rs —
# we do NOT adopt webauthn-rs's session/state model so we can bind OUR
# ChallengePreimage commitment as the expected challenge. MPL-2.0 (weak,
# per-file copyleft; acceptable as an unmodified upstream dependency).
webauthn-rs-core = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# Test-only software authenticator: mint P-256/ES256 assertions to drive the
# verifier through valid + adversarial paths. Already in the lockfile via
# webauthn-rs-core's transitive graph.
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
